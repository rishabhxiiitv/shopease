name: ShopEase CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION:   us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_TAG:    ${{ github.sha }}

jobs:

  # ── Test Backend ────────────────────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: backend
        run: mvn test -B

  # ── Test Frontend ───────────────────────────────────────────────────────────
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ── Build & Push Docker Images ──────────────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend
        run: |
          docker build -f docker/Dockerfile.backend \
            -t $ECR_REGISTRY/shopease-backend:$IMAGE_TAG \
            -t $ECR_REGISTRY/shopease-backend:latest \
            ./backend
          docker push $ECR_REGISTRY/shopease-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/shopease-backend:latest

      - name: Build & push frontend
        run: |
          docker build -f docker/Dockerfile.frontend \
            -t $ECR_REGISTRY/shopease-frontend:$IMAGE_TAG \
            -t $ECR_REGISTRY/shopease-frontend:latest \
            ./frontend
          docker push $ECR_REGISTRY/shopease-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/shopease-frontend:latest

  # ── Deploy to EKS ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name shopease-cluster --region $AWS_REGION

      - name: Deploy to Kubernetes
        run: |
          # Apply all manifests
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/postgres/
          kubectl apply -f k8s/backend/
          kubectl apply -f k8s/frontend/
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml

          # Roll out new images
          kubectl set image deployment/shopease-backend \
            backend=$ECR_REGISTRY/shopease-backend:$IMAGE_TAG \
            -n shopease

          kubectl set image deployment/shopease-frontend \
            frontend=$ECR_REGISTRY/shopease-frontend:$IMAGE_TAG \
            -n shopease

          # Wait for rollout
          kubectl rollout status deployment/shopease-backend  -n shopease --timeout=120s
          kubectl rollout status deployment/shopease-frontend -n shopease --timeout=60s

      - name: Verify deployment
        run: kubectl get pods -n shopease
