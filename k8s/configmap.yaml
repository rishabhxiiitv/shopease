apiVersion: v1
kind: ConfigMap
metadata:
  name: shopease-config
  namespace: shopease
data:
  # Spring Boot
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL:           "false"
  JWT_EXPIRATION:                "86400000"

  # AWS
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "shopease-images"

  # CORS
  APP_CORS_ALLOWED_ORIGINS: "https://your-domain.com"
