apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopease-frontend
  namespace: shopease
  labels:
    app: shopease-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopease-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: shopease-frontend
    spec:
      containers:
        - name: frontend
          image: YOUR_ECR_REGISTRY/shopease-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
